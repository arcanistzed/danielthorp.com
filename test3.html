<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root { --radius-1: 12px; --color-accent: blue; }
  body { font-family: sans-serif; padding: 2rem; background: #fff; }
  .socials {
    display: flex;
    gap: 1rem;
  }
  .socials a {
    display: flex;
    width: 2.5rem;
    background: #eee;
  }
  .socials a.fixed {
    height: 2.5rem;
    align-items: center;
    justify-content: center;
    border-radius: 50%; /* or var(--radius-1) */
  }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  svg { width: 1.25rem; height: 1.25rem; }
</style>
</head>
<body>
  <nav class="socials">
    <a href="#" autofocus>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2z"/></svg>
    </a>
    <a href="#" class="fixed">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2z"/></svg>
    </a>
  </nav>
</body>
</html>
