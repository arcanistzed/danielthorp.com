<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root { --radius-1: 12px; --color-accent: blue; }
  body { font-family: sans-serif; padding: 2rem; background: #fff; }
  .posts { list-style: none; padding: 0; width: 300px; display: flex; flex-direction: column; gap: 1rem; }
  .posts li {
    border: 1px solid #ccc;
    border-radius: var(--radius-1);
    background: #f9f9f9;
  }
  .posts a {
    display: flex;
    flex-direction: column;
    padding: 1rem;
    text-decoration: none;
    color: black;
  }
  .posts a.fixed {
    border-radius: inherit;
  }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
</head>
<body>
  <ul class="posts">
    <li>
      <a href="#" autofocus>Sharp Outline (Current)</a>
    </li>
    <li>
      <a href="#" class="fixed">Rounded Outline (Fixed)</a>
    </li>
  </ul>
</body>
</html>
