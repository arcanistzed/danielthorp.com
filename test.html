<!DOCTYPE html>
<html>
<head>
<style>
  :root { --color-accent: #6366e8; --radius-1: 0.5rem; }
  :focus-visible {
	outline: 2px solid var(--color-accent);
	outline-offset: 2px;
  }
  .posts li {
	border: 1px solid black;
	border-radius: var(--radius-1);
	background: #eee;
    padding: 0;
    list-style: none;
    width: 200px;
  }
  .posts a {
	display: flex;
	padding: 1rem;
	text-decoration: none;
  }
</style>
</head>
<body>
  <ul class="posts">
    <li><a href="#">Link 1</a></li>
    <li><a href="#" style="border-radius: inherit;">Link 2 (Inherit)</a></li>
  </ul>
</body>
</html>
